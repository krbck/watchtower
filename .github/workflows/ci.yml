name: ci

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "ui/**"
      - "chart/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "ui/**"
      - "chart/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
      - name: build
        run: go build ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: lint
        run: helm lint chart/watchtower
