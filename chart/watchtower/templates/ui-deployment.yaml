{{- if .Values.ui.enabled }}
# faz-1 UI: separate deployment (D-001), never talks to the cluster directly;
# proxies to the manager API via cluster DNS (D-008).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "watchtower.fullname" . }}-ui
  labels:
    {{- include "watchtower.labels" . | nindent 4 }}
    watchtower.krbck.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "watchtower.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      watchtower.krbck.io/component: ui
  template:
    metadata:
      labels:
        {{- include "watchtower.labels" . | nindent 8 }}
        watchtower.krbck.io/component: ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          env:
            - name: WATCHTOWER_API_URL
              value: "http://{{ include "watchtower.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.api.port }}"
            - name: WATCHTOWER_UI_LISTEN
              value: ":8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
