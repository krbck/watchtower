{{- if and .Values.controller.rbac.create (ne (include "watchtower.istioMode" .) "false") }}
# D-036/D-037: separate read-only role for the Istio integration. Rendered
# in "auto" too (deliberate small relaxation: RBAC on an absent API group
# grants nothing, and a later Istio install activates without an upgrade).
# Set integrations.istio.enabled=false to drop it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "watchtower.fullname" . }}-istio-reader
  labels:
    {{- include "watchtower.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "gateways"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "watchtower.fullname" . }}-istio-reader
  labels:
    {{- include "watchtower.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "watchtower.fullname" . }}-istio-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "watchtower.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
